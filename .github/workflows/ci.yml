name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: shaderc
        run: sudo apt-get update && sudo apt-get install -y glslc
      - run: cargo test -p pointman-ai -p pointman-assets -p pointman-game
